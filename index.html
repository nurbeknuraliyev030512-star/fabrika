<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ferma boshqaruvi — Tuxum fermasi</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" hidden>
  <div class="lg">
    <div class="egg"><i></i></div>
    <h1>Ferma boshqaruvi</h1>
    <p>Faqat ferma boshqaruvchisi uchun. PIN kodni kiriting.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN kod" maxlength="12">
    <button class="pri" id="go">Kirish</button>
    <div class="err" id="err" role="alert"></div>
    <p id="hint" style="font-size:12px;margin-top:8px"></p>
  </div>
</div>
<div id="app" hidden>
  <aside>
    <div class="brand"><b><i></i></b>Tuxum fermasi</div>
    <nav id="nav" aria-label="Bo‘limlar"></nav>
    <div class="side-foot"><button data-a="chpin">PIN kodni o‘zgartirish</button><button data-a="out">Chiqish</button></div>
  </aside>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" hidden role="status"></div>
<script src="script.js"></script>
</body>
</html>
